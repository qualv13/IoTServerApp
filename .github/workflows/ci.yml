name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # The `test` profile is H2 in memory with the MQTT client mocked out, so
      # this needs no database, no broker and no credentials.
      - run: ./mvnw -B --no-transfer-progress verify
