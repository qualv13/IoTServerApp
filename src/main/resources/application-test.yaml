# Profile for the automated tests. Everything here is in-process on purpose:
# the suite has to run on a clean checkout with no Postgres, no broker and no
# credentials. Anything that genuinely needs a service belongs in a
# Testcontainers test, not in this file.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    listener:
      simple:
        auto-startup: false

# Never dialled. These exist to satisfy the @Value bindings so the context can
# start; no test publishes or subscribes.
mqtt:
  broker: tcp://localhost:1883
  broker-url: tcp://localhost:1883
  host: localhost
  port: 1883
  client-id: test-client
  username: test
  password: test
  topics:
    command: lamps/+/command
    metrics: lamps/+/metrics

# Placeholders. No test uploads firmware, and the real keys belong in the
# deployment environment, never in the repository.
cloudflare:
  r2:
    access-key: test
    secret-key: test
    endpoint: http://localhost:9000
    bucket: test-bucket
    public-url: http://localhost:9000/test-bucket

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
